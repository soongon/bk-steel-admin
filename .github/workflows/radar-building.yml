name: 발주 레이더 · 건축HUB(주1회)

# 민간(건축인허가) 수집 — 날짜필터가 없어 법정동 전체를 페이징(경주 198 법정동 ≈360콜).
# v2(2026-10): 경주만·최근 365일. 포항·울산 민간은 수집 중단(실매출 근거 없음·60분 타임아웃 원인).
# 주기는 주 1회 유지 — 건축HUB API 발행이 사실상 월 1회라 더 자주 돌려도 신규가 없다(기획안 §7).
on:
  schedule:
    - cron: '30 21 * * 6'   # 매주 일 06:30 KST (토 21:30 UTC)
  workflow_dispatch:

concurrency:
  group: radar-building
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40       # 경주만(198 법정동) — 실측 13~51분의 ~30% 예상
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 20은 native WebSocket 미지원 → supabase-js realtime 에러
          cache: 'npm'
      - run: npm ci
      - name: 건축HUB 수집·upsert (경주 풀싱크)
        run: npm run radar:collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_BUILDING_KEY: ${{ secrets.DATA_GO_KR_BUILDING_KEY }}
          DATA_GO_KR_NARA_KEY: ${{ secrets.DATA_GO_KR_NARA_KEY || secrets.DATA_GO_KR_BUILDING_KEY }}
          # 건축HUB만 (nara 제외)
          RADAR_SOURCES: building_permit
          # 경주만 (v2) — 포항·울산 기존 행은 보존·화면 제외
          RADAR_REGIONS: gyeongju
          # 건축HUB active 윈도(일) — 730→365(v2). 방문 창은 '단계 반영일 60일'이라 그 이상 과거 허가·착공은 불필요
          RADAR_ACTIVE_DAYS: '365'
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
